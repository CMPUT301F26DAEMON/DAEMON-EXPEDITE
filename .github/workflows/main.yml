name: Android CI
on:
  pull_request:
    branches: [main, master]
  # Runs on main save the Gradle cache that pull request runs then read from.
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
      # Caches Gradle's downloads between runs, so CI doesn't fetch every dependency from
      # Maven Central each time (which gets rate-limited with 403 Forbidden).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./code
      - name: Build and test with Gradle
        run: make
        working-directory: ./code
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
